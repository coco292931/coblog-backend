{{/* 首页。时间轴是纯 CSS 静态的（主站的圆点靠脚本随滚动定位）。 */}}

{{define "home"}}{{template "head" .}}

<div class="lite-hero">海内存知己，天涯若比邻</div>

{{if .Articles}}
<div class="lite-timeline">
  {{range .Articles}}
  <div class="lite-tl-item">{{template "card" .}}</div>
  {{end}}
</div>
{{if .HasMore}}
<div class="lite-pager"><a class="lite-btn" href="{{.MoreURL}}">查看更多</a></div>
{{else}}
<div class="lite-empty">— 没有更多了 —</div>
{{end}}
{{end}}

{{template "foot" .}}{{end}}
